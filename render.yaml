# Render deployment config — https://render.com
# Deploy the FastAPI backend as a Web Service

services:
  - type: web
    name: finguard-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: MONGODB_URL
        sync: false          # Set in Render dashboard
      - key: MONGODB_DB
        value: finguard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://finguard.vercel.app"]'
      - key: FRAUD_THRESHOLD
        value: "0.65"
      - key: BATCH_ANALYSIS_INTERVAL_SEC
        value: "30"
